spec_version: "0.1.0"
name: "agentweb-runtime-engine"
version: "1.0.0"
description: >
  Powerful and flexible Android WebView agent runtime library, providing unified lifecycle orchestration,
  JavaScript bridge injection, file chooser and camera upload interception, and secure URL scheme filtering.
author: "Chithra R"
license: "Apache-2.0"

model:
  preferred: "claude-3-5-sonnet"
  fallback:
    - "gpt-4o"
    - "gemini-2.0-flash"
  constraints:
    temperature: 0.1
    max_tokens: 8192

skills:
  - webview-lifecycle-orchestration
  - javascript-bridge-binding
  - file-upload-chooser-interceptor
  - scheme-security-guardrail

tools:
  - webview-container-builder
  - js-bridge-interface-manager
  - file-upload-pipeline-handler
  - url-scheme-security-filter
  - progress-indicator-controller

runtime:
  max_turns: 25
  temperature: 0.1
  timeout: 180

compliance:
  risk_tier: standard
  frameworks:
    - mitre-atlas
    - owasp-llm
  data_governance:
    pii_handling: redact
    data_classification: confidential
  recordkeeping:
    audit_logging: true
    log_format: structured_json
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - developer-tools
  - android
  - webview
  - agentweb
  - mobile-agent
  - java
  - androidx

metadata:
  domain: "developer-tools"
  category: "Developer Tools"
